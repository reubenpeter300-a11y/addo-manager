
name: Build ADDO Manager APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ADDO_Manager_v0_5_DOWNLOAD.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract app
        run: |
          unzip ADDO_Manager_v0_5_DOWNLOAD.zip
          cd addomanager_flutter
          flutter pub get
          flutter build apk --release

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: ADDO-Manager-APK
          path: addomanager_flutter/build/app/outputs/flutter-apk/app-release.apk
