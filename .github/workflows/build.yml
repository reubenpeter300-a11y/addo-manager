
name: Build ADDO Manager APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ADDO_Manager_v0_5_DOWNLOAD.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract ADDO Manager
        run: |
          unzip ADDO_Manager_v0_5_DOWNLOAD.zip
          test -f addomanager_flutter/pubspec.yaml

      - name: Fix suppliers page
        working-directory: addomanager_flutter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("lib/suppliers_page.dart")
          s = p.read_text()
          old = "child: Text(t('Hifadhi','Save'))],"
          new = "child: Text(t('Hifadhi','Save')))],"
          if old in s:
              p.write_text(s.replace(old, new, 1))
          print("Suppliers page checked")
          PY

      - name: Generate Android project
        working-directory: addomanager_flutter
        run: flutter create --platforms=android .

      - name: Set compileSdk 36
        working-directory: addomanager_flutter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle")
          ]

          for p in files:
              if p.exists():
                  s = p.read_text()
                  s, n = re.subn(
                      r'(?m)^(\s*compileSdk(?:Version)?\s*=?\s*)(?:flutter\.compileSdkVersion|\d+)',
                      r'\g<1>36',
                      s,
                      count=1
                  )
                  assert n == 1, "Could not update compileSdk in " + str(p)
                  p.write_text(s)
                  print("Updated", p)
                  break
          else:
              raise Exception("Android app Gradle file not found")

          PY

      - name: Install dependencies
        working-directory: addomanager_flutter
        run: flutter pub get

      - name: Build APK
        working-directory: addomanager_flutter
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ADDO-Manager-APK
          path: addomanager_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
