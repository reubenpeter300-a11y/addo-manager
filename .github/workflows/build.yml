
name: Build ADDO Manager APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ADDO_Manager_v0_5_DOWNLOAD.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract ADDO Manager
        run: |
          unzip -o ADDO_Manager_v0_5_DOWNLOAD.zip
          test -f addomanager_flutter/pubspec.yaml

      - name: Fix suppliers page
        working-directory: addomanager_flutter
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("lib/suppliers_page.dart")
          s = p.read_text()

          old = "child: Text(t('Hifadhi','Save')),"
          new = "child: Text(t('Hifadhi','Save'))))],"

          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)
              print("Suppliers page syntax fixed")
          else:
              print("Target text not found; checking current file")
          PY

      - name: Generate Android project
        working-directory: addomanager_flutter
        run: flutter create --platforms=android .

      - name: Install Android API 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set compileSdk 36
        working-directory: addomanager_flutter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle")
          ]

          for p in files:
              if p.exists():
                  s = p.read_text()
                  s, n = re.subn(
                      r'(?m)^(\s*compileSdk(?:Version)?\s*[=(]?\s*)\d+',
                      r'\g<1>36',
                      s,
                      count=1
                  )
                  if n:
                      p.write_text(s)
                  print("Checked", p)
                  break
          else:
              raise Exception("Android Gradle file not found")
          PY

      - name: Upgrade file_picker dependencies
        working-directory: addomanager_flutter
        run: |
          flutter pub upgrade file_picker
          flutter pub get

      - name: Build APK
        working-directory: addomanager_flutter
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ADDO-Manager-APK
          path: addomanager_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          
