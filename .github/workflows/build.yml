
name: Build ADDO Manager APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ADDO_Manager_v0_5_DOWNLOAD.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract ADDO Manager
        run: |
          unzip ADDO_Manager_v0_5_DOWNLOAD.zip
          test -f addomanager_flutter/pubspec.yaml
          test -f addomanager_flutter/lib/suppliers_page.dart

      - name: Fix suppliers page syntax
        working-directory: addomanager_flutter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("lib/suppliers_page.dart")
          s = p.read_text()
          old = "child: Text(t('Hifadhi','Save'))],"
          new = "child: Text(t('Hifadhi','Save')))],"
          assert old in s, "Original error line not found"
          p.write_text(s.replace(old, new, 1))
          print("Suppliers page fixed successfully")
          PY

      - name: Generate Android project
        working-directory: addomanager_flutter
        run: flutter create --platforms=android .

      - name: Install dependencies
        working-directory: addomanager_flutter
        run: flutter pub get

      - name: Build release APK
        working-directory: addomanager_flutter
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ADDO-Manager-APK
          path: addomanager_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
